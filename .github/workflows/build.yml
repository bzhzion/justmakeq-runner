name: Build and push runner image

on:
  # Deploiement sur tag de version uniquement, jamais sur un push de branche : pousser un
  # correctif de documentation ou une experimentation sur main ne doit pas partir en production.
  # Poser un tag vX.Y.Z pour livrer. Volontairement sans filtre de chemin : GitHub combine
  # (branches/tags) ET paths, ce qui rend le declencheur sur tag imprevisible des qu'un filtre
  # de chemin est present.
  push:
    tags: ['v*.*.*']
  schedule:
    - cron: '0 3 * * 1'  # Rebuild hebdomadaire (lundi 3h) pour mises a jour securite
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Reconstruire sans cache (force une base image et un runner a jour)'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Le rebuild hebdomadaire (cron) existe pour recuperer les mises a
      # jour de securite de la base image myoung34/github-runner - mais
      # cache-from: type=gha reutilise les couches sans revalider le
      # digest de la base upstream tant que le Dockerfile ne change pas.
      # Constate le 2026-09-24 : l'image poussee affichait toujours la
      # date de creation de juillet malgre plusieurs rebuilds reussis
      # depuis, et le runner GitHub Actions qu'elle embarquait avait ete
      # depreciee cote GitHub sans que rien ne le signale. Le cron ET le
      # declenchement manuel avec no_cache=true ignorent donc le cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/bzhzion/justmakeq-runner:latest
            ghcr.io/bzhzion/justmakeq-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
